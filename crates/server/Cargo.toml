[package]
name = "steno-server"
description = "Recording, detection, storage, transcription and the HTTP/UI layer."
version.workspace = true
edition.workspace = true

[dependencies]
steno-lib = { path = "../lib", features = ["db"] }

axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
cpal.workspace = true
futures-util.workspace = true
hound.workspace = true
include_dir.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true

[[bin]]
name = "steno-monitor"
path = "src/main.rs"

# The audio.cpp recogniser, built from the same crate so it ships and deploys with
# the server: no app bundle, no shell wrapper, no conf file to be rewritten.
[[bin]]
name = "steno-stt-sidecar-audiocpp"
path = "src/bin/steno-stt-sidecar-audiocpp.rs"
